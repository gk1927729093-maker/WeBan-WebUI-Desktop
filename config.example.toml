# 首次使用时复制为 config.toml，再通过 WebUI 添加自己的账号。
# 默认按及格完成，AI 功能需自行配置后启用。
account = []

[settings]
study_mode = "true"
exam_mode = "true"
random_answer = true
study_time = 30
video_speed = 1
exam_question_time = "3,3"
exam_submit_match_rate = 90
max_workers = 5
browser_path = ""
cdp_host = ""
cdp_port = 0
debug = false

[ai]
enable = false
base_url = ""
api_key = ""
model = ""
timeout = 60
max_retries = 2
